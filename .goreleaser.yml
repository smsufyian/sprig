version: 2
project_name: sprig

before:
  hooks:
    - go mod tidy

builds:
  - id: sprig
    main: ./cmd/sprig
    binary: sprig
    ldflags:
      - -X github.com/smsufyian/sprig/internal/version.Version={{ .Version }}
      - -X github.com/smsufyian/sprig/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/smsufyian/sprig/internal/version.BuildDate={{ .Date }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0

archives:
  - id: sprig
    format: tar.gz
    name_template: "sprig_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
  groups:
    - title: Features
      regexp: "^feat"
    - title: Bug Fixes
      regexp: "^fix"
    - title: Other
      order: 999
